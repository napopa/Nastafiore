name: Publication safety

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install pinned secret scanner
        shell: bash
        run: |
          set -euo pipefail
          version=8.30.1
          scanner_dir="$(mktemp -d)"
          cd "$scanner_dir"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${version}"
          archive="gitleaks_${version}_linux_x64.tar.gz"
          curl --fail --silent --show-error --location "$base/$archive" --output "$archive"
          curl --fail --silent --show-error --location "$base/gitleaks_${version}_checksums.txt" --output checksums.txt
          awk -v archive="$archive" '$2 == archive { print }' checksums.txt > selected-checksum.txt
          test -s selected-checksum.txt
          sha256sum --check selected-checksum.txt
          tar -xzf "$archive" gitleaks
          echo "$scanner_dir" >> "$GITHUB_PATH"
      - name: Verify publication guards
        run: python3 scripts/test-publication.py
      - name: Scan complete publication history
        run: python3 scripts/check-publication.py history
